name: Build Artifacts

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifacts (e.g., 2025.12.1)'
        required: true
        default: '2026.1.1'

permissions:
  contents: read

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if commit has release tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/* ]] && git tag --points-at HEAD | grep -q '^v'; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping beta build: commit already has a release tag"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CARGO_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME//$'\n'/'%0A'} 与 Cargo.toml version ${CARGO_VERSION} 不一致（见 openspec/project.md 版本同步强约束）"
            exit 1
          fi

  build:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
            echo "version=beta-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install admin-ui dependencies
        working-directory: web-ui/admin-ui
        run: pnpm install

      - name: Build admin-ui
        working-directory: web-ui/admin-ui
        run: pnpm build

      - name: Install user-ui dependencies
        working-directory: web-ui/user-ui
        run: npm install

      - name: Build user-ui
        working-directory: web-ui/user-ui
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build app
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiro2cc-proxy-${{ steps.version.outputs.version }}-${{ matrix.name }}
          if-no-files-found: error
          compression-level: 6
          path: |
            target/${{ matrix.target }}/release/kiro2cc-proxy
            target/${{ matrix.target }}/release/kiro2cc-proxy.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kiro2cc-proxy-*
          path: dist

      - name: Package and checksum
        run: |
          cd dist
          for d in */; do
            name="${d%/}"
            count=$(ls -A "$d" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::${name} 内容非唯一（${count} 个文件），无法确定打包目标"
              exit 1
            fi
            bin=$(ls -A "$d")
            if [[ "$name" == *Windows* ]]; then
              (cd "$d" && zip -q "../${name}.zip" "$bin")
            else
              (cd "$d" && chmod +x "$bin" && tar -czf "../${name}.tar.gz" "$bin")
            fi
          done
          rm -rf */
          sha256sum * > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums-sha256.txt
          generate_release_notes: true
          body: |
            ## 安装

            - macOS（Apple Silicon / Intel）与 Windows 下载对应平台压缩包，解压后运行（macOS 如提示无执行权限，先 `chmod +x kiro2cc-proxy`），配置见 [README](${{ github.server_url }}/${{ github.repository }}#readme)
            - Linux 推荐 Docker 部署（见 README 章节或 GHCR 镜像）
            - 完整性校验：`sha256sum -c checksums-sha256.txt`
