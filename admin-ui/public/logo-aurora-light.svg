<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <!-- 白天模式瓷白/珍珠质感底座渐变 -->
    <linearGradient id="auBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <!-- 极光三色流光边框 (紫 -> 青 -> 绿 -> 橙) -->
    <linearGradient id="auBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#06B6D4" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.85"/>
    </linearGradient>
    <!-- 幽灵本体极光幻彩渐变 (摆脱官方死板紫色) -->
    <linearGradient id="auGhostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="40%" stop-color="#4F46E5"/>
      <stop offset="75%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <!-- Claude Code 珊瑚橙反代星芒渐变 -->
    <linearGradient id="auStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- 双层极光柔和光晕投影 -->
    <filter id="auShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 瓷白圆角矩形底座 -->
  <rect width="1200" height="1200" rx="280" fill="url(#auBgLight)"/>
  <!-- 极光多色微光边框 -->
  <rect x="14" y="14" width="1172" height="1172" rx="268" fill="none" stroke="url(#auBorderLight)" stroke-width="14"/>

  <!-- 幽灵极光主体 -->
  <g filter="url(#auShadowL)">
    <path d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z" fill="url(#auGhostGrad)"/>
    <!-- 双眼：纯白晶莹透亮 -->
    <path d="M636.123 549.353C603.328 549.353 598.359 510.097 598.359 486.742C598.359 465.623 602.086 448.977 609.293 438.293C615.504 428.852 624.697 424.131 636.123 424.131C647.555 424.131 657.492 428.852 664.447 438.541C672.398 449.474 676.623 466.12 676.623 486.742C676.623 525.998 661.471 549.353 636.375 549.353H636.123Z" fill="#FFFFFF"/>
    <path d="M771.24 549.353C738.445 549.353 733.477 510.097 733.477 486.742C733.477 465.623 737.203 448.977 744.41 438.293C750.621 428.852 759.814 424.131 771.24 424.131C782.672 424.131 792.609 428.852 799.564 438.541C807.516 449.474 811.74 466.12 811.74 486.742C811.74 525.998 796.588 549.353 771.492 549.353H771.24Z" fill="#FFFFFF"/>
    <!-- 头顶 Claude Code 反代星芒光标与极光能量光环 -->
    <circle cx="610" cy="180" r="26" fill="#6366F1" opacity="0.15"/>
    <circle cx="610" cy="180" r="16" fill="#06B6D4"/>
    <g transform="translate(610, 180) scale(1.8)">
      <polygon points="0,-10 2.5,-3 10,0 2.5,3 0,10 -2.5,3 -10,0 -2.5,-3" fill="url(#auStarGrad)"/>
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>